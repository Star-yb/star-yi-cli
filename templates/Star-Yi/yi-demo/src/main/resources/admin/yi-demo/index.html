<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/fragments :: head('演示文章', ~{::style})}">
    <style>
        .code-cell {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<aside th:replace="~{common/fragments :: sidebar('demo-article')}"></aside>

<main class="main-wrapper">
    <header th:replace="~{common/fragments :: topbar('演示文章')}"></header>

    <div class="content-area">
        <div class="page-header">
            <div>
                <h1 class="page-title">演示文章</h1>
                <p class="page-subtitle">
                    yi-demo 标准 CRUD 示例的管理端页面；REST 接口路径为 <code>/demo/articles</code>。
                </p>
            </div>
        </div>

        <form class="search-card" method="get" th:action="@{/admin/demo/articles}">
            <div class="form-group">
                <label>文章编码</label>
                <input type="text" name="articleCode" class="form-control" placeholder="模糊搜索"
                       th:value="${param.articleCode}">
            </div>
            <div class="form-group">
                <label>文章标题</label>
                <input type="text" name="articleTitle" class="form-control" placeholder="模糊搜索"
                       th:value="${param.articleTitle}">
            </div>
            <input type="hidden" name="size" th:if="${param.size != null}" th:value="${param.size}">
            <div class="search-actions">
                <button type="submit" class="btn btn-primary" style="height: 40px;">
                    <i class='bx bx-search'></i> 查询
                </button>
                <a th:href="@{/admin/demo/articles}" class="btn btn-outline"
                   style="height: 40px; text-decoration: none; display: flex; align-items: center;">
                    <i class='bx bx-reset'></i> 重置
                </a>
            </div>
        </form>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-toolbar-left">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">
                        本页演示「业务模块注册超级管理员页面」的最小实现，详见 <code>docs/admin-page-extension.md</code>
                    </span>
                </div>
                <div>
                    <span style="font-size: 0.875rem; color: var(--text-muted);">
                        共查询到
                        <strong style="color: var(--text-main);" th:text="${articlesPageResult.count}">0</strong>
                        条
                    </span>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>文章编码</th>
                        <th>标题</th>
                        <th>内容摘要</th>
                        <th>创建时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(articlesPageResult.results)}">
                        <td colspan="5" style="text-align: center; padding: 40px 0; color: var(--text-muted);">
                            <i class='bx bx-news' style="font-size: 3rem; opacity: 0.5;"></i>
                            <p style="margin-top: 8px;">暂无演示文章，可通过 REST <code>POST /demo/articles</code> 创建</p>
                        </td>
                    </tr>
                    <tr th:each="row : ${articlesPageResult.results}">
                        <td th:text="${row.id}">1</td>
                        <td class="code-cell" th:text="${row.articleCode}">CODE</td>
                        <td th:text="${row.articleTitle}">标题</td>
                        <td th:text="${row.content != null ? (#strings.length(row.content) > 40 ? #strings.substring(row.content, 0, 40) + '…' : row.content) : '-'}">-</td>
                        <td th:text="${#temporals.format(row.createdTime, 'yyyy-MM-dd HH:mm')}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/fragments :: adminPagination(${articlesPageResult}, '/admin/demo/articles')}"></th:block>
        </div>
    </div>
</main>

<div th:replace="~{common/fragments :: common_modals}"></div>
<div th:replace="~{common/fragments :: common_scripts}"></div>
</body>
</html>
