<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/fragments :: head('登录日志', ~{::style})}">
    <style>
        .cleanup-card {
            background: #fff;
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cleanup-card h3 {
            margin: 0 0 6px;
            font-size: 1rem;
            color: var(--text-main);
        }

        .cleanup-desc {
            margin: 0 0 16px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .cleanup-group {
            margin-bottom: 14px;
        }

        .cleanup-group:last-child {
            margin-bottom: 0;
        }

        .cleanup-group-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .cleanup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .cleanup-actions .form-control {
            width: 100px;
            height: 36px;
        }

        .btn-danger-soft {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .btn-danger-soft:hover {
            background: #fee2e2;
        }

        .log-ua {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: bottom;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

<aside th:replace="~{common/fragments :: sidebar('login-log')}"></aside>

<main class="main-wrapper">
    <header th:replace="~{common/fragments :: topbar('登录日志')}"></header>

    <div class="content-area">
        <div class="page-header">
            <div>
                <h1 class="page-title">登录日志</h1>
                <p class="page-subtitle">查看 API 登录/登出记录，支持批量与按规则清理历史数据。</p>
            </div>
        </div>

        <div class="cleanup-card">
            <h3><i class='bx bx-trash'></i> 数据清理</h3>
            <p class="cleanup-desc">
                当前库中共 <strong th:text="${totalLogCount}">0</strong> 条日志。清理操作不可恢复，请谨慎执行。
            </p>

            <div class="cleanup-group">
                <div class="cleanup-group-title">按时间清理</div>
                <div class="cleanup-actions">
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanOlderThan(7)">清理 7 天前</button>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanOlderThan(30)">清理 30 天前</button>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanOlderThan(90)">清理 90 天前</button>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanOlderThan(180)">清理 180 天前</button>
                    <input type="number" id="customDays" class="form-control" min="1" value="30" placeholder="天数">
                    <button type="button" class="btn btn-outline" onclick="cleanOlderThanCustom()">自定义天数</button>
                </div>
            </div>

            <div class="cleanup-group">
                <div class="cleanup-group-title">按保留条数清理</div>
                <div class="cleanup-actions">
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanKeepLatest(500)">仅保留 500 条</button>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanKeepLatest(1000)">仅保留 1000 条</button>
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="cleanKeepLatest(5000)">仅保留 5000 条</button>
                    <input type="number" id="customKeepCount" class="form-control" min="1" value="1000" placeholder="条数">
                    <button type="button" class="btn btn-outline" onclick="cleanKeepLatestCustom()">自定义保留</button>
                </div>
            </div>

            <div class="cleanup-group">
                <div class="cleanup-group-title">危险操作</div>
                <div class="cleanup-actions">
                    <button type="button" class="btn btn-danger-soft" onclick="cleanAll()">
                        <i class='bx bx-trash'></i> 一键清空全部
                    </button>
                </div>
            </div>
        </div>

        <form class="search-card" th:action="@{/admin/login-log}" method="get">
            <div class="form-group">
                <label>登录账号</label>
                <input type="text" name="username" class="form-control" placeholder="用户名/手机号" th:value="${param.username}">
            </div>
            <div class="form-group">
                <label>操作类型</label>
                <select class="form-control" name="loginType">
                    <option value="">全部</option>
                    <option value="1" th:selected="${#strings.equals(param.loginType, '1')}">登录</option>
                    <option value="2" th:selected="${#strings.equals(param.loginType, '2')}">登出</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select class="form-control" name="status">
                    <option value="">全部</option>
                    <option value="0" th:selected="${#strings.equals(param.status, '0')}">成功</option>
                    <option value="1" th:selected="${#strings.equals(param.status, '1')}">失败</option>
                </select>
            </div>
            <input type="hidden" name="size" th:if="${param.size != null}" th:value="${param.size}">
            <div class="search-actions">
                <button type="submit" class="btn btn-primary" style="height: 40px;"><i class='bx bx-search'></i> 搜索</button>
                <a th:href="@{/admin/login-log}" class="btn btn-outline" style="height: 40px; text-decoration: none; display: flex; align-items: center;">
                    <i class='bx bx-reset'></i> 重置
                </a>
            </div>
        </form>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-toolbar-left">
                    <button type="button" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.75rem;" onclick="batchDeleteSelected()">
                        <i class='bx bx-trash' style="color: var(--danger-color);"></i> 批量删除选中
                    </button>
                </div>
                <div>
                    <span style="font-size: 0.875rem; color: var(--text-muted);">共查询到 <strong style="color: var(--text-main);" th:text="${loginLogsPageResult.count}">0</strong> 条</span>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                    <tr>
                        <th style="width: 50px;"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)"></th>
                        <th>ID</th>
                        <th>用户ID</th>
                        <th>登录账号</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>失败原因</th>
                        <th>IP</th>
                        <th>浏览器 / 系统</th>
                        <th>时间</th>
                        <th style="text-align: right;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(loginLogsPageResult.results)}">
                        <td colspan="11" style="text-align: center; padding: 40px 0; color: var(--text-muted);">
                            <i class='bx bx-folder-open' style="font-size: 3rem; opacity: 0.5;"></i>
                            <p style="margin-top: 8px;">暂无登录日志</p>
                        </td>
                    </tr>
                    <tr th:each="log : ${loginLogsPageResult.results}">
                        <td><input type="checkbox" class="row-check" th:value="${log.id}"></td>
                        <td th:text="${log.id}">1</td>
                        <td th:text="${log.userId != null ? log.userId : '-'}">-</td>
                        <td><span style="font-weight: 600;" th:text="${log.username}">admin</span></td>
                        <td>
                            <span th:if="${log.loginType == 1}" class="badge badge-info">登录</span>
                            <span th:if="${log.loginType == 2}" class="badge badge-success">登出</span>
                        </td>
                        <td>
                            <span th:if="${log.status == 0}" class="badge badge-success">成功</span>
                            <span th:if="${log.status == 1}" class="badge badge-danger" style="background: #fee2e2; color: #991b1b;">失败</span>
                        </td>
                        <td style="color: var(--text-muted); max-width: 140px;" th:text="${log.failReason != null ? log.failReason : '-'}">-</td>
                        <td th:text="${log.ipAddress != null ? log.ipAddress : '-'}">-</td>
                        <td>
                            <span th:text="${(log.browser != null ? log.browser : '-') + ' / ' + (log.os != null ? log.os : '-')}">-</span>
                            <span th:if="${log.userAgent != null}" class="log-ua" th:title="${log.userAgent}" th:text="${log.userAgent}"></span>
                        </td>
                        <td style="color: var(--text-muted); white-space: nowrap;" th:text="${log.loginTime != null ? #temporals.format(log.loginTime, 'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
                        <td>
                            <div class="action-links" style="justify-content: flex-end;">
                                <a href="javascript:void(0)" class="action-link danger" title="删除" th:data-id="${log.id}" onclick="deleteOne(this.getAttribute('data-id'))">
                                    <i class='bx bx-trash'></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/fragments :: adminPagination(${loginLogsPageResult}, '/admin/login-log')}"></th:block>
        </div>
    </div>
</main>

<div th:replace="~{common/fragments :: common_modals}"></div>
<div th:replace="~{common/fragments :: common_scripts}"></div>

<script>
    function toggleCheckAll(el) { $('.row-check').prop('checked', el.checked); }
    function getSelectedIds() {
        var ids = [];
        $('.row-check:checked').each(function () { ids.push($(this).val()); });
        return ids;
    }
    function reloadSoon() { setTimeout(function () { location.reload(); }, 800); }
    function doDelete(url, confirmMsg) {
        customConfirm(confirmMsg, function () {
            $.ajax({
                url: url, type: 'DELETE',
                success: function (res) {
                    if (res.code === 200) { customAlert(res.msg || res.message || '操作成功', '成功'); reloadSoon(); }
                    else { customAlert('操作失败: ' + (res.message || res.msg), '错误'); }
                },
                error: function () { customAlert('网络请求发生错误', '错误'); }
            });
        });
    }
    function deleteOne(id) { doDelete('/admin/login-log/' + id, '确定删除该条登录日志吗？'); }
    function batchDeleteSelected() {
        var ids = getSelectedIds();
        if (ids.length === 0) { customAlert('请先勾选要删除的日志', '提示'); return; }
        doDelete('/admin/login-log/batch?ids=' + ids.join(','), '确定批量删除选中的 ' + ids.length + ' 条日志吗？');
    }
    function cleanOlderThan(days) {
        doDelete('/admin/login-log/clean/older-than?days=' + days, '确定清理 ' + days + ' 天前的所有登录日志吗？此操作不可恢复！');
    }
    function cleanOlderThanCustom() {
        var days = parseInt($('#customDays').val(), 10);
        if (!days || days < 1) { customAlert('请输入有效的天数（≥1）', '提示'); return; }
        cleanOlderThan(days);
    }
    function cleanKeepLatest(count) {
        doDelete('/admin/login-log/clean/keep-latest?count=' + count, '确定仅保留最新 ' + count + ' 条日志，删除其余全部记录吗？此操作不可恢复！');
    }
    function cleanKeepLatestCustom() {
        var count = parseInt($('#customKeepCount').val(), 10);
        if (!count || count < 1) { customAlert('请输入有效的保留条数（≥1）', '提示'); return; }
        cleanKeepLatest(count);
    }
    function cleanAll() { doDelete('/admin/login-log/clean/all', '【高危】确定一键清空全部登录日志吗？此操作不可恢复！'); }
</script>
</body>
</html>
