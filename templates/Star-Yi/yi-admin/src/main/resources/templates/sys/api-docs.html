<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/fragments :: head('接口文档', ~{::style})}">
    <style>
        .content-area.api-docs-content {
            display: flex;
            flex-direction: column;
            padding: 16px 24px 24px;
            overflow: hidden;
        }

        .api-docs-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .api-docs-toolbar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .api-docs-toolbar-title i {
            color: var(--primary-color);
            font-size: 1.25rem;
        }

        .api-docs-toolbar-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .api-docs-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-docs-frame-wrap {
            flex: 1;
            min-height: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .api-docs-frame-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 200px);
            border: none;
        }
    </style>
</head>

<body>

<aside th:replace="~{common/fragments :: sidebar('api-docs')}"></aside>

<main class="main-wrapper">
    <header th:replace="~{common/fragments :: topbar('接口文档')}"></header>

    <div class="content-area api-docs-content">
        <div class="api-docs-toolbar">
            <div class="api-docs-toolbar-title">
                <i class='bx bx-book-open'></i>
                <span>
                    OpenAPI / Swagger UI
                    <span class="api-docs-toolbar-hint">（内嵌预览，与 springdoc 配置路径一致）</span>
                </span>
            </div>
            <div class="api-docs-toolbar-actions">
                <a th:href="@{${swaggerUiPath}}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                    <i class='bx bx-link-external'></i>
                    新标签页打开
                </a>
            </div>
        </div>

        <div class="api-docs-frame-wrap">
            <iframe th:src="@{${swaggerUiPath}}" title="接口文档"></iframe>
        </div>
    </div>
</main>

<div th:replace="~{common/fragments :: common_modals}"></div>
<div th:replace="~{common/fragments :: common_scripts}"></div>

</body>

</html>
