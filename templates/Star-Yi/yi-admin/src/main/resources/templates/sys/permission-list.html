<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/fragments :: head('权限列表选择', ~{::style})}">
    <style>
        .code-text {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .selected-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .selected-tag {
            display: inline-flex;
            align-items: center;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.8rem;
            gap: 6px;
        }

        .selected-tag i {
            cursor: pointer;
            font-size: 1rem;
        }

        .payload-box {
            width: 100%;
            min-height: 140px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85rem;
            resize: vertical;
            background: #f8fafc;
        }
    </style>
</head>

<body>
<aside th:replace="~{common/fragments :: sidebar('permission')}"></aside>

<main class="main-wrapper">
    <header th:replace="~{common/fragments :: topbar('权限列表选择')}"></header>

    <div class="content-area">
        <div class="page-header">
            <div>
                <h1 class="page-title">权限列表选择（非树形）</h1>
                <p class="page-subtitle">直接以列表展示权限，支持多选组成新角色。</p>
            </div>
            <div>
                <a th:href="@{/admin/permission}" class="btn btn-outline">
                    <i class='bx bx-sitemap'></i> 返回树形页
                </a>
            </div>
        </div>

        <form class="search-card" th:action="@{/admin/permission-list}" method="get">
            <div class="form-group">
                <label>权限名称</label>
                <input type="text" class="form-control" name="permissionName" th:value="${param.permissionName}" placeholder="模糊搜索">
            </div>
            <div class="form-group">
                <label>权限标识</label>
                <input type="text" class="form-control" name="permissionCode" th:value="${param.permissionCode}" placeholder="如 system:user:add">
            </div>
            <div class="form-group">
                <label>类型</label>
                <select class="form-control" name="permissionType">
                    <option value="">全部</option>
                    <option value="1" th:selected="${param.permissionType == '1'}">菜单</option>
                    <option value="2" th:selected="${param.permissionType == '2'}">按钮</option>
                    <option value="3" th:selected="${param.permissionType == '3'}">接口</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select class="form-control" name="status">
                    <option value="">全部</option>
                    <option value="0" th:selected="${param.status == '0'}">正常</option>
                    <option value="1" th:selected="${param.status == '1'}">停用</option>
                </select>
            </div>
            <input type="hidden" name="size" th:if="${param.size != null}" th:value="${param.size}">
            <div class="search-actions">
                <button type="submit" class="btn btn-primary"><i class='bx bx-search'></i> 搜索</button>
                <a th:href="@{/admin/permission-list}" class="btn btn-outline" style="text-decoration:none;display:flex;align-items:center;">
                    <i class='bx bx-reset'></i> 重置
                </a>
            </div>
        </form>

        <div class="table-card">
            <div class="table-toolbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <label style="display:flex;align-items:center;gap:6px;margin:0;">
                        <input type="checkbox" id="selectAllPerms">
                        <span>全选当前列表</span>
                    </label>
                    <span style="color:var(--text-muted);">已选 <strong id="selectedCount">0</strong> 项</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button type="button" class="btn btn-primary" id="composeRoleBtn">
                        <i class='bx bx-user-plus'></i> 组成新角色
                    </button>
                    <span style="color:var(--text-muted);">当前页 <strong th:text="${permissionsPageResult != null && permissionsPageResult.results != null ? #lists.size(permissionsPageResult.results) : 0}">0</strong> 项</span>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                    <tr>
                        <th style="width:40px;"></th>
                        <th>ID</th>
                        <th>权限名称</th>
                        <th>标识</th>
                        <th>类型</th>
                        <th>路径</th>
                        <th>状态</th>
                        <th style="text-align:right;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${permissionsPageResult == null || permissionsPageResult.results == null || #lists.isEmpty(permissionsPageResult.results)}">
                        <td colspan="8" style="text-align:center;color:var(--text-muted);padding:30px 0;">无匹配数据</td>
                    </tr>
                    <tr th:each="perm : ${permissionsPageResult.results}">
                        <td><input type="checkbox" class="perm-check" th:value="${perm.id}" th:data-name="${perm.permissionName}"></td>
                        <td th:text="${perm.id}">1</td>
                        <td th:text="${perm.permissionName}">权限</td>
                        <td class="code-text" th:text="${perm.permissionCode}">code</td>
                        <td>
                            <span th:if="${perm.permissionType == 1}" class="badge badge-info">菜单</span>
                            <span th:if="${perm.permissionType == 2}" class="badge badge-warning" style="background:#fef3c7;color:#b45309;">按钮</span>
                            <span th:if="${perm.permissionType == 3}" class="badge" style="background:#e5e7eb;color:#374151;">接口</span>
                        </td>
                        <td th:text="${perm.path != null && perm.path != '' ? perm.path : '-'}">-</td>
                        <td>
                            <span th:if="${perm.status == 0}" class="badge badge-success">正常</span>
                            <span th:if="${perm.status == 1}" class="badge badge-danger" style="background:#fee2e2;color:#991b1b;">停用</span>
                        </td>
                        <td>
                            <div class="action-links" style="justify-content:flex-end;">
                                <a href="javascript:void(0)" class="action-link" title="编辑"
                                   th:data-id="${perm.id}"
                                   th:data-permissioncode="${perm.permissionCode}"
                                   th:data-permissionname="${perm.permissionName}"
                                   th:data-permissiontype="${perm.permissionType}"
                                   th:data-path="${perm.path}"
                                   th:data-icon="${perm.icon}"
                                   th:data-sortorder="${perm.sortOrder}"
                                   th:data-status="${perm.status}"
                                   onclick="openPermissionModal(this)">
                                    <i class='bx bx-edit-alt'></i>
                                </a>
                                <a href="javascript:void(0)" class="action-link danger" title="删除"
                                   th:data-id="${perm.id}"
                                   onclick="deletePermission(this.getAttribute('data-id'))">
                                    <i class='bx bx-trash'></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{common/fragments :: adminPagination(${permissionsPageResult}, '/admin/permission-list')}"></th:block>

        <div class="selected-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong>已选权限</strong>
                <button type="button" class="btn btn-outline" style="padding:4px 10px;" id="clearSelectedBtn">清空选择</button>
            </div>
            <div class="selected-tags" id="selectedTags">
                <span style="color:var(--text-muted);font-size:0.9rem;">暂无已选权限</span>
            </div>
        </div>

    </div>
</main>

<div class="modal-overlay" id="composeRoleModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">组成新角色</h3>
            <div class="modal-close" onclick="closeModal('composeRoleModal')"><i class='bx bx-x'></i></div>
        </div>
        <div class="modal-body">
            <div class="form-group" style="margin-bottom:12px;">
                <label>角色名称</label>
                <input type="text" class="form-control" id="composeRoleName" placeholder="例如：运营管理员">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>角色标识</label>
                <input type="text" class="form-control" id="composeRoleCode" placeholder="例如：ops_admin">
            </div>
            <p style="color:var(--text-muted);margin:4px 0 0 0;">
                点击“复制参数”将把参数写入控制台，请在浏览器开发者工具查看并复制。
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('composeRoleModal')">取消</button>
            <button class="btn btn-primary" id="copyPayloadBtn">输出参数</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="permissionModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="permissionModalTitle">编辑权限</h3>
            <div class="modal-close" onclick="closeModal('permissionModal')"><i class='bx bx-x'></i></div>
        </div>
        <div class="modal-body">
            <form id="permissionForm">
                <input type="hidden" id="form-permissionId" name="id">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>权限名称</label>
                    <input type="text" class="form-control" id="form-permissionName" name="permissionName" required>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>权限标识</label>
                    <input type="text" class="form-control" id="form-permissionCode" name="permissionCode" required>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>类型</label>
                    <select class="form-control" id="form-permissionType" name="permissionType">
                        <option value="1">菜单</option>
                        <option value="2">按钮</option>
                        <option value="3">接口</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>路径</label>
                    <input type="text" class="form-control" id="form-path" name="path">
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>图标</label>
                    <input type="text" class="form-control" id="form-icon" name="icon">
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>排序</label>
                    <input type="number" class="form-control" id="form-sortOrder" name="sortOrder" value="1">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" id="form-status" name="status">
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('permissionModal')">取消</button>
            <button class="btn btn-primary" onclick="submitPermissionForm()">保存</button>
        </div>
    </div>
</div>

<div th:replace="~{common/fragments :: common_modals}"></div>
<div th:replace="~{common/fragments :: common_scripts}"></div>

<script>
    function getCheckedItems() {
        return Array.from(document.querySelectorAll('.perm-check:checked')).map(function (el) {
            return {
                permissionId: Number(el.value),
                permissionName: el.getAttribute('data-name') || ''
            };
        });
    }

    function buildPayload() {
        var ids = getCheckedItems().map(function (x) { return x.permissionId; });
        return {
            roleId: null, // 预留：后续可填具体 roleId
            permissionIds: ids
        };
    }

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var selected = getCheckedItems();
        document.getElementById('selectedCount').textContent = String(selected.length);

        if (!selected.length) {
            container.innerHTML = '<span style="color:var(--text-muted);font-size:0.9rem;">暂无已选权限</span>';
            return;
        }

        container.innerHTML = selected.map(function (item) {
            return '<span class="selected-tag">' +
                item.permissionName + ' (#' + item.permissionId + ')' +
                '<i class="bx bx-x" data-remove-id="' + item.permissionId + '"></i>' +
                '</span>';
        }).join('');
    }

    function buildComposePayload() {
        var payload = buildPayload();
        payload.roleName = document.getElementById('composeRoleName') ? document.getElementById('composeRoleName').value.trim() : '';
        payload.roleCode = document.getElementById('composeRoleCode') ? document.getElementById('composeRoleCode').value.trim() : '';
        return payload;
    }

    function syncSelectAll() {
        var all = Array.from(document.querySelectorAll('.perm-check'));
        var checked = all.filter(function (el) { return el.checked; });
        document.getElementById('selectAllPerms').checked = all.length > 0 && checked.length === all.length;
    }

    document.addEventListener('change', function (e) {
        if (e.target.classList.contains('perm-check')) {
            renderSelectedTags();
            // compose modal 打开时无需写入页面文本框，参数仅控制台输出
            syncSelectAll();
        }
    });

    document.getElementById('selectAllPerms').addEventListener('change', function () {
        var checked = this.checked;
        document.querySelectorAll('.perm-check').forEach(function (el) {
            el.checked = checked;
        });
        renderSelectedTags();
        // compose modal 打开时无需写入页面文本框，参数仅控制台输出
    });

    document.getElementById('clearSelectedBtn').addEventListener('click', function () {
        document.querySelectorAll('.perm-check').forEach(function (el) {
            el.checked = false;
        });
        renderSelectedTags();
        // compose modal 打开时无需写入页面文本框，参数仅控制台输出
        syncSelectAll();
    });

    document.getElementById('selectedTags').addEventListener('click', function (e) {
        var removeId = e.target.getAttribute('data-remove-id');
        if (!removeId) return;
        var target = document.querySelector('.perm-check[value="' + removeId + '"]');
        if (target) {
            target.checked = false;
            renderSelectedTags();
            // compose modal 打开时无需写入页面文本框，参数仅控制台输出
            syncSelectAll();
        }
    });

    document.getElementById('copyPayloadBtn').addEventListener('click', function () {
        var payload = buildComposePayload();
        console.log('compose-role payload:', payload);
        customAlert('参数已输出到控制台（F12 查看）', '提示');
    });

    document.getElementById('composeRoleBtn').addEventListener('click', function () {
        if (getCheckedItems().length === 0) {
            customAlert('请先至少选择一项权限', '提示');
            return;
        }
        // 参数按需控制台输出，不再页面展示
        document.getElementById('composeRoleModal').classList.add('active');
    });

    document.getElementById('composeRoleName').addEventListener('input', function () {});
    document.getElementById('composeRoleCode').addEventListener('input', function () {});

    function openPermissionModal(element) {
        var $el = $(element);
        $('#permissionModalTitle').text('编辑权限');
        $('#permissionForm')[0].reset();
        $('#form-permissionId').val($el.attr('data-id'));
        $('#form-permissionCode').val($el.attr('data-permissioncode'));
        $('#form-permissionName').val($el.attr('data-permissionname'));
        $('#form-permissionType').val($el.attr('data-permissiontype'));
        $('#form-path').val($el.attr('data-path') || '');
        $('#form-icon').val($el.attr('data-icon') || '');
        $('#form-sortOrder').val($el.attr('data-sortorder') || '1');
        $('#form-status').val($el.attr('data-status') || '0');
        $('#permissionModal').addClass('active');
    }

    function submitPermissionForm() {
        var permissionId = $('#form-permissionId').val();
        var dataObj = {};
        $.each($('#permissionForm').serializeArray(), function (i, field) {
            if (field.value !== undefined) {
                dataObj[field.name] = field.value;
            }
        });

        dataObj.permissionType = parseInt(dataObj.permissionType || 1);
        dataObj.sortOrder = parseInt(dataObj.sortOrder || 1);
        dataObj.status = parseInt(dataObj.status ?? 0);
        $.ajax({
            url: '/permissions/' + permissionId,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(dataObj),
            success: function (res) {
                if (res.code === 200) {
                    customAlert('保存成功', '成功');
                    closeModal('permissionModal');
                    setTimeout(function () { location.reload(); }, 700);
                } else {
                    customAlert('保存失败: ' + (res.message || res.msg), '错误');
                }
            },
            error: function () {
                customAlert('网络请求发生错误，保存失败。', '错误');
            }
        });
    }

    function deletePermission(permissionId) {
        customConfirm('确定要删除该权限吗？', function () {
            $.ajax({
                url: '/admin/permission/' + permissionId,
                type: 'DELETE',
                success: function (res) {
                    if (res.code === 200) {
                        customAlert('删除成功', '成功');
                        setTimeout(function () { location.reload(); }, 700);
                    } else {
                        customAlert('删除失败: ' + (res.message || res.msg), '错误');
                    }
                },
                error: function () {
                    customAlert('网络请求发生错误，删除失败。', '错误');
                }
            });
        });
    }

    renderSelectedTags();
    syncSelectAll();
</script>
</body>
</html>
