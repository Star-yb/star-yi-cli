<!DOCTYPE html>
<html lang="zh" xmlns:sa="http://www.thymeleaf.org/extras/sa-token">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 易系统后台管理</title>
    <!-- 引入Google Fonts: Inter -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <!-- 引入BoxIcons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" th:href="@{/static/css/login.css}">
</head>

<body>

    <!-- 背景装饰 -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class='bx bxl-xing logo-icon'></i>
                <h1 class="login-title">欢迎回来，{projectName}</h1>
                <p class="login-subtitle">请登录您的系统管理账户</p>
                <div sa:login style="text-align: center; padding: 10px 0;">
                    <div style="margin-bottom: 30px;">
                        <i class='bx bx-check-shield' style="font-size: 4rem; color: #10b981;"></i>
                        <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--text-main); margin-top: 16px;">
                            您已成功登录系统</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">
                            欢迎回来！您的当前账号状态为已验证，无需重复登录。
                        </p>
                    </div>

                    <div style="display: flex; gap: 16px; margin-top: 32px;">
                        <a th:href="@{/admin/user}" class="btn-login"
                            style="text-decoration: none; display: flex; align-items: center; justify-content: center; flex: 1;">
                            <i class='bx bx-home-alt'
                                style="vertical-align: middle; margin-right: 6px; font-size: 1.25em;"></i>
                            进 入 首 页
                        </a>
                        <!-- 您需要在Controller中定义一个退出接口，如 @GetMapping("/logout")，并在其中调用 StpUtil.logout() 然后重定向到登录页 -->
                        <a th:href="@{/admin/logout}" class="btn-login"
                            style="text-decoration: none; display: flex; align-items: center; justify-content: center; background-color: var(--bg-color); color: var(--danger-color); border: 1px solid var(--border-color); flex: 1;">
                            <i class='bx bx-log-out-circle'
                                style="vertical-align: middle; margin-right: 6px; font-size: 1.25em;"></i>
                            退 出 登 录
                        </a>
                    </div>
                </div>

                <!-- 未登录状态下才能显示的内容区域（包括登录表单和错误提示） -->
                <div sa:notLogin>
                    <!-- Thymeleaf: 错误提示。接收通过 RedirectAttributes 传递的 flash 错误信息 -->
                    <div class="alert-error" th:if="${errorMsg != null}">
                        <i class='bx bx-error-circle'></i>
                        <span th:text="${errorMsg}">
                            用户名或密码错误，请重试！
                        </span>
                    </div>

                    <!-- Thymeleaf: 退出成功提示 -->
                    <div class="alert-error" style="background-color: #d1fae5; color: #065f46; border-color: #a7f3d0;"
                        th:if="${param.logout != null}">
                        <i class='bx bx-check-circle'></i>
                        <span>您已成功安全退出系统。</span>
                    </div>

                    <!-- Thymeleaf: th:action 给定提交地址，th:method 绑定请求方式 -->
                    <form th:action="@{/admin/login}" method="post" style="text-align: left;">

                        <!-- 用户名输入框 -->
                        <div class="form-group">
                            <label for="username">用户名 / 邮箱</label>
                            <div style="position: relative;">
                                <!-- Thymeleaf: 使用 th:value 回显后端 Flash 中传递的 historyUsername -->
                                <input type="text" id="username" name="username" class="form-control"
                                    placeholder="请输入登录用户名" required autocomplete="username"
                                    th:value="${historyUsername}">
                                <i class='bx bx-user input-icon'></i>
                            </div>
                        </div>

                        <!-- 密码输入框 -->
                        <div class="form-group">
                            <label for="password">密码</label>
                            <div style="position: relative;">
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="请输入您的密码" required autocomplete="current-password">
                                <i class='bx bx-lock-alt input-icon'></i>
                            </div>
                        </div>

                        <!-- 验证码 (可选预留，如果不接可以删除) -->
                        <!-- <div class="form-group" style="display: flex; gap: 12px;">
                    <div style="position: relative; flex: 1;">
                        <input type="text" name="captcha" class="form-control" placeholder="请输入验证码">
                        <i class='bx bx-check-shield input-icon'></i>
                    </div>
                    <img th:src="@{/captcha}" alt="验证码" style="border-radius: 8px; cursor: pointer; height: 44px;">
                </div> -->

                        <div class="extra-options">
                            <label class="remember-me">
                                <!-- Thymeleaf: name 设置为 remember-me  -->
                                <input type="checkbox" name="remember-me">
                                <span>记住我 (7天免登录)</span>
                            </label>
                            <a href="#" class="forgot-password">忘记密码？</a>
                        </div>

                        <button type="submit" class="btn-login" style="margin-top: 8px;">
                            <i class='bx bx-log-in-circle'
                                style="vertical-align: middle; margin-right: 4px; font-size: 1.25em;"></i>
                            立 即 登 录
                        </button>
                    </form>
                </div>

                <div style="margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
                    &copy; <span th:text="${#calendars.format(#calendars.createNow(), 'yyyy')}">2026</span> {projectName}
                    System.
                    All rights reserved.
                </div>
            </div>
        </div>
    </div>

</body>

</html>
