logging:
  level:
    org:
      springframework:
        boot:
          autoconfigure: error # 错误级别 error  warn  info  debug  trace




sa-token:
  token-name: satoken # token 名称（同时也是 cookie 名称）
  timeout: 86400 # token 有效期（单位：秒） 默认30天(2592000),7天(604800),1天(86400)，-1 代表永久有效
  active-timeout: -1 # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  is-concurrent: true # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-share: false # 多人同账号登录时是否共用 token；false=每次登录独立 token
  # 注意：独立 token 只保证「登录」互不覆盖；退出必须用 logoutByTokenValue / 无参 logout(TOKEN 范围)。
  # 切勿对 API 退出调用 StpUtil.logout(loginId, "api")，那会踢掉该账号所有 api 端会话。
  # is-share: true # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  token-style: uuid # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  is-log: true # 是否输出操作日志
  jwt-secret-key: asdasdasifhueuiwyurfewbfjsdafjk # JWT 密钥



# ========== OpenAPI 3 + Swagger UI（springdoc-openapi，仅 yi-admin 运行时生效）==========
# 说明：业务模块 apps/* 只通过 yi-common 使用注解；文档生成与 UI 由本配置 + OpenApiConfigure 完成。
# 接入流程见：docs/openapi-swagger.md
springdoc:
  api-docs:
    enabled: true          # 是否暴露 OpenAPI JSON（供 Swagger UI 或 Postman 导入）
    path: /v3/api-docs     # JSON 地址，默认分组时为 /v3/api-docs
  swagger-ui:
    enabled: true          # 是否启用可视化调试页面
    path: /swagger-ui.html # 浏览器访问入口（另需在 SaTokenConfigure 放行）
    tags-sorter: alpha     # 左侧分组按字母排序
    operations-sorter: alpha # 分组内接口按字母排序
  packages-to-scan: com.star # 扫描哪些包下的 @RestController（含 apps/*、yi-demo、yi-admin）
  show-actuator: false     # 不把 Actuator 端点写入文档

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.MySqlDialect # 数据库方言类名 DefaultDialect MySqlDialect  PostgresDialect SQLiteDialect
  show-sql: true # 自动打印被执行的SQL
  pretty-sql: true # 打印的sql是格式  良好  紧凑(默认)
  database-validation-mode: ERROR # 如果非NONE，验证数据库结构和代码实体类型结构的一致性，如果不一致，WARNING导致日志告警，ERROR导致报错
  default-batch-size: 256 # 批量操作的默认批次大小
  default-list-batch-size: 32 # 批量操作的默认列表批次大小
  is-foreign-key-enabled-by-default: false # 是否默认启用外键约束

# 附件本地存储（ed-attachment 模块）
ed:
  attachment:
    storage:
      local-dir: apps/ed-attachment/src/main/resources/files # 本地存储目录
      public-url-prefix: /ed/attachments/files # 公共URL前缀
      bucket: local # 存储桶名称
      max-file-size: 52428800 # 50MB


