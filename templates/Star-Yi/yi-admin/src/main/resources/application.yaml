server:
  port: 8500
  servlet:
    contextPath: / # 设置项目前缀
    session:
      # 仅 Cookie 追踪会话，禁止 URL 重写（避免首次访问出现 /admin/login;jsessionid=xxx 被 Sa-Token 防火墙拦截）
      tracking-modes: cookie



spring:
  application:
    name: star # 设置项目名称
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  web:
    resources:
      static-locations: classpath:/static/,classpath:/templates/
  mvc:
    view:
      prefix: / # 设置视图前缀
      suffix: .html
    static-path-pattern: /static/**  # 静态资源路径
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
  datasource:
#    url: jdbc:sqlite:D:/JAVA_File/springboot_web_file/Star-Yi/yi-admin/src/main/resources/star.db
#    driver-class-name: org.sqlite.JDBC
#    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/abc?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource

  data:
    # redis配置
    redis:
      # Redis数据库索引（默认为0）
      database: 1
      # Redis服务器地址
      host: 127.0.0.1
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: 123456
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0


